<section>
<h2>اليوم 1: من الحاجة إلى نموذج يعمل</h2>
<ol>
<li><p>تطلب إدارة أخرى فتح متتبع المعدات لمصورين متعاونين من خارج المركز برابط عام، مع حفظ أرقام حساباتهم البنكية لخصم غرامة التأخير. ما مصير الطلب؟</p><ul><li><b>أ.</b> يُبنى: المتتبع موجود، وهذه إضافة صغيرة إليه</li><li><b>ب.</b> يُبنى ببيانات اصطناعية، ثم يُفتح الرابط حين ينجح</li><li><b>ج.</b> يُبنى بمراجعة تقنية المعلومات قبل فتح الرابط</li><li><b>د.</b> يُحال إلى المطورين بطلب مكتوب من صفحة</li></ul></li>
<li><p>فريق يبني أداة لحجز سيارات الجهة. القاعدة: الحجز ثلاثة أيام على الأكثر. أي جملة تصلح اختبار قبول؟</p><ul><li><b>أ.</b> الأداة تتحقق من مدة الحجز بدقة وسرعة</li><li><b>ب.</b> موظف يحجز سيارة من الأحد إلى الأربعاء: يُرفض، والرسالة تذكر الحد</li><li><b>ج.</b> لا يُسمح بحجز يزيد على ثلاثة أيام</li><li><b>د.</b> موظف يحجز سيارة لمدة مسموحة فيُقبل حجزه</li></ul></li>
<li><p>تبني أداة لحجز سيارات الجهة مع وكيل برمجة. أي هذه الأسطر تكتبه في ملف التعليمات لا في المحادثة؟</p><ul><li><b>أ.</b> المنع يكون في الخادم: كل صفحة تتحقق من دور من يفتحها</li><li><b>ب.</b> انقل زر «احجز» إلى أعلى صفحة السيارات</li><li><b>ج.</b> كلمة سر حساب المدير هي التي أرسلتها لك أمس</li><li><b>د.</b> اختبار الحجز لأربعة أيام فشل: قُبل الطلب</li></ul></li>
<li><p>طلبت من الوكيل إضافة تصدير الحجوزات. التصدير يعمل. ثم أعدت الاختبارات السابقة، فوجدت أن حجز أربعة أيام صار يُقبل والحد ثلاثة. ماذا تفعل أولًا؟</p><ul><li><b>أ.</b> تطلب من الوكيل إصلاح حد الأيام فوق التغيير الحالي</li><li><b>ب.</b> تقبل التغيير لأن التصدير يعمل، وتسجل الخلل لتصلحه لاحقًا</li><li><b>ج.</b> تتراجع إلى نقطة الحفظ، ثم تطلب التصدير بطلب أدق</li><li><b>د.</b> تبدأ مشروعًا جديدًا من المواصفات وملف التعليمات</li></ul></li>
<li><p>منسق تدريب يريد أداة تسجل حضور ورشة داخلية لفريقه المكوّن من عشرة، بأسماء تجريبية في مرحلة التجربة، على جهازه وحده، ولا تتصل بأي نظام. ما مصير الطلب؟</p><ul><li><b>أ.</b> يُبنى</li><li><b>ب.</b> يُبنى بمراجعة تقنية المعلومات</li><li><b>ج.</b> يُحال إلى المطورين</li><li><b>د.</b> يُرفض لأنه يحفظ أسماء</li></ul></li>
<li><p>فريق العلاقات يريد لوحة تعرض أعداد زوار المعرض من ملف أسبوعي، لا أسماء فيه، ويفتحها موظفو أربع إدارات من رابط على الشبكة الداخلية. ما مصير الطلب؟</p><ul><li><b>أ.</b> يُبنى ويُرسل الرابط إلى الإدارات</li><li><b>ب.</b> يُبنى بمراجعة تقنية المعلومات</li><li><b>ج.</b> يُحال إلى المطورين</li><li><b>د.</b> يُبنى على جهاز واحد ثم يُصوَّر للإدارات</li></ul></li>
<li><p>إدارة خدمة العملاء تريد نموذجًا على موقع الجهة يكتب فيه المراجعون شكاواهم بأسمائهم وجوالاتهم وأرقام هوياتهم. موظف في الإدارة يقول إنه يستطيع بناءه بمنصة في يوم. ما مصير الطلب؟</p><ul><li><b>أ.</b> يُبنى، ما دام يستطيع بناءه في يوم</li><li><b>ب.</b> يُبنى ببيانات اصطناعية ثم يُفتح للمراجعين</li><li><b>ج.</b> يُبنى بمراجعة تقنية المعلومات</li><li><b>د.</b> يُحال إلى المطورين</li></ul></li>
<li><p>أداة مقترحة تحسب بدل الانتداب لموظفي إدارة واحدة، ثم ترسل المبلغ المعتمد إلى نظام الرواتب. المستخدمون موظفو الإدارة فقط. أي سؤال من الأسئلة الخمسة يحسم أنها تُحال إلى المطورين؟</p><ul><li><b>أ.</b> المستخدمون</li><li><b>ب.</b> الاعتماد</li><li><b>ج.</b> الأثر</li><li><b>د.</b> البيانات</li></ul></li>
<li><p>أداة بناها فريق لنفسه نجحت. بعد ثلاثة أشهر تستخدمها خمس إدارات، وفيها أسماء موظفين حقيقية، ويتعطل تسليم المعدات إن توقفت. الشيفرة لم تتغير. ما الذي يجب أن يحدث؟</p><ul><li><b>أ.</b> لا شيء: الأداة نفسها ما زالت تعمل</li><li><b>ب.</b> يتوقف الفريق عن تعديلها وتُسلَّم إلى المطورين</li><li><b>ج.</b> يضيف الفريق نسخة احتياطية ويستمر</li><li><b>د.</b> تُراجَع مرة واحدة ثم يشغّلها الفريق كما كان</li></ul></li>
<li><p>أداة صغيرة لتتبع بلاغات أعطال الطابعات في مبنى واحد. الأفعال: الموظف يبلّغ، والفني يرى البلاغات ويغلقها. أي حقل يُشطب من المواصفات؟</p><ul><li><b>أ.</b> رقم الطابعة</li><li><b>ب.</b> وصف العطل</li><li><b>ج.</b> تاريخ البلاغ</li><li><b>د.</b> الجوال الشخصي للمبلّغ</li></ul></li>
<li><p>قالت صاحبة الحاجة: «الطلبات الكبيرة تحتاج إلى موافقة المديرة». أي صياغة تصلح قاعدة في المواصفات؟</p><ul><li><b>أ.</b> الطلبات الكبيرة تُعرض على المديرة قبل تنفيذها</li><li><b>ب.</b> كل طلب قيمته 2,000 ريال فأكثر لا يُنفَّذ قبل موافقة المديرة</li><li><b>ج.</b> تتحقق الأداة من الطلبات الكبيرة بدقة قبل أن تنفذها</li><li><b>د.</b> المديرة توافق على الطلبات المهمة قبل أن تُنفَّذ في الأداة</li></ul></li>
<li><p>مواصفات أداة لحجز قاعة فيها خمسة اختبارات قبول، كلها لحجوزات صحيحة تُقبل. القاعدة: الحجز أربع ساعات على الأكثر. أي اختبار تضيفه أولًا؟</p><ul><li><b>أ.</b> موظف يحجز ساعتين: يُقبل الحجز ويظهر في حجوزاته</li><li><b>ب.</b> موظف يحجز خمس ساعات: يُرفض، والرسالة تذكر الحد</li><li><b>ج.</b> الأداة تعرض القاعات المتاحة كلها بسرعة ووضوح</li><li><b>د.</b> المدير يفتح صفحة الحجوزات: يرى حجوزات الجميع</li></ul></li>
<li><p>في جدول الوصول لأداة فريق تُركت خانة «يرى سجلات غيره» فارغة لعضو الفريق. المواصفات تذهب إلى وكيل البرمجة كما هي. ما الذي يحدث لهذه الخانة؟</p><ul><li><b>أ.</b> الوكيل يقرر عنك بما يخمّنه</li><li><b>ب.</b> الوكيل يمنع كل ما لم يُذكر</li><li><b>ج.</b> الوكيل يتوقف ويسأل دائمًا</li><li><b>د.</b> المنصة ترفض المواصفات الناقصة</li></ul></li>
<li><p>قاعدة في مواصفات: «مدة الإعارة 5 أيام على الأكثر، ويُحسب يوم البداية ويوم النهاية كلاهما». موظف يطلب من 2027-04-04 إلى 2027-04-09. كم يومًا مدة هذا الطلب بحساب القاعدة؟ <span class="unit">(أيام)</span></p></li>
<li><p>في كل جلسة جديدة يشرح لك وكيل البرمجة تغييراته بأسماء الدوال والملفات، فتطلب منه لغة العمل، فيلتزم إلى آخر الجلسة ثم يعود. أين تعالج ذلك؟</p><ul><li><b>أ.</b> تكرر الطلب في أول كل محادثة</li><li><b>ب.</b> تكتبه في ملف التعليمات</li><li><b>ج.</b> تكتبه في المواصفات تحت «القواعد»</li><li><b>د.</b> تطلبه بعد كل تغيير حين يلزم</li></ul></li>
<li><p>طلبت من الوكيل خطة قبل البناء. الخطوة الأولى في خطته: «أبني الصفحات كلها وأربطها بقاعدة بيانات سحابية». المواصفات تقول: بيانات في ملف محلي. ماذا تفعل؟</p><ul><li><b>أ.</b> توافق، وتختبر كل شيء حين ينتهي البناء كله</li><li><b>ب.</b> توافق على الصفحات، وتؤجل أمر قاعدة البيانات</li><li><b>ج.</b> تطلب خطوة أولى صغيرة، وبلا خدمة خارجية</li><li><b>د.</b> تبدأ مشروعًا جديدًا بمنصة أخرى غير هذه</li></ul></li>
<li><p>أنهى الوكيل الخطوة الأولى وكتب: «اختبرتُ الدخول ونموذج الطلب، وكل شيء يعمل». ما الذي يجعلك تقبل الخطوة؟</p><ul><li><b>أ.</b> أن الوكيل شغّل الأداة بنفسه وجرّبها</li><li><b>ب.</b> أن الشاشة تبدو كما وصفتها في المواصفات</li><li><b>ج.</b> أنك نفذت اختبارات الخطوة بيدك ونجحت</li><li><b>د.</b> أن الوكيل لم يذكر أي خطأ في ردّه</li></ul></li>
<li><p>رتّب خطوات قبول تغيير واحد في أداة تبنيها مع وكيل برمجة، من الأولى إلى الأخيرة.</p><ul><li>تعيد الاختبارات السابقة كلها</li><li>تقبل أو تتراجع، وتكتب سطرًا في السجل</li><li>تطلب تغييرًا واحدًا</li><li>تحفظ نقطة حفظ</li><li>تختبر الجديد بيدك</li></ul></li>
<li><p>بعد ساعتين من العمل: فشلت ثلاث محاولات لإصلاح ترتيب الجدول، وأعاد الوكيل كتابة صفحة الدخول دون طلب، ولم تعد تستطيع أن تصف لزميلك ما في الأداة. المواصفات وملف التعليمات جيدان. ما القرار؟</p><ul><li><b>أ.</b> محاولة رابعة للإصلاح نفسه بوصف أطول</li><li><b>ب.</b> مشروع جديد من المواصفات وملف التعليمات</li><li><b>ج.</b> قبول الأداة كما هي وتسجيل عيوبها</li><li><b>د.</b> طلب إعادة كتابة كل شيء في المحادثة نفسها</li></ul></li>
<li><p>أربعة أسطر من سجلات تغييرات لأربعة مشاركين، كلها عن إضافة التصدير. أي سطر يُقبل دليلًا على خطوة بناء؟</p><ul><li><b>أ.</b> «نقطة الحفظ: الخطوة 3. الوكيل شغّل التصدير وقال إنه يعمل مع كل ما سبق. قُبل.»</li><li><b>ب.</b> «نقطة الحفظ: الخطوة 3. أضفت التصدير وغيّرت الألوان وأصلحت البحث. كله يعمل. قُبل.»</li><li><b>ج.</b> «نقطة الحفظ: الخطوة 3. نفذت الاختبار الجديد والتسعة السابقة بيدي: نجحت. قُبل.»</li><li><b>د.</b> «نقطة الحفظ: الخطوة 3. جرّبت التصدير بيدي مرة وظهر الملف كما توقعت. قُبل.»</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: اختبر، وافحص، وسلّم</h2>
<ol>
<li><p>طلبت من الوكيل إضافة صفحة جديدة إلى أداتك. كتب: «أضفتها، واختبرتها، ولم أغيّر شيئًا آخر». متى تكتب «قُبل» في سجل التغييرات؟</p><ul><li><b>أ.</b> حين يؤكد الوكيل أن اختباراته نجحت</li><li><b>ب.</b> حين تنجح بيدك اختبارات الصفحة والاختبارات السابقة كلها</li><li><b>ج.</b> حين تفتح الصفحة الجديدة وتراها تعمل</li><li><b>د.</b> حين تنتهي الخطوات كلها وتختبر الأداة مرة واحدة</li></ul></li>
<li><p>أداة مكتبة تحسب غرامة عن كل يوم بعد موعد إرجاع الكتاب. تشك في أن الحساب يزيد يومًا. عندك وقت لحالة واحدة. أيها تختار؟</p><ul><li><b>أ.</b> كتاب أُرجع بعد شهر من موعده</li><li><b>ب.</b> كتاب أُرجع قبل موعده بأسبوع</li><li><b>ج.</b> كتاب أُرجع في يوم موعده</li><li><b>د.</b> كتاب لم يُرجع بعد</li></ul></li>
<li><p>زميلك بنى أداة لطلبات الصيانة، ويقول: «صفحة الإعدادات للمدير فقط: دخلتُ موظفًا عاديًّا ولم أجد رابطها في أي مكان». ما الاختبار الذي ينقصه؟</p><ul><li><b>أ.</b> يدخل موظفًا عاديًّا، ويكتب عنوان صفحة الإعدادات بيده</li><li><b>ب.</b> يدخل مديرًا، ويتأكد أن صفحة الإعدادات تُفتح له</li><li><b>ج.</b> يدخل موظفًا عاديًّا، ويبحث عن الرابط في كل القوائم</li><li><b>د.</b> يسأل الوكيل هل الصفحة محمية، ويحفظ جوابه</li></ul></li>
<li><p>مديرتك تريد أن يرسل نموذج الفريق الأولي رسائل تذكير نصية، وأعطتك مفتاح خدمة الرسائل التي تشترك فيها الجهة. ماذا تفعل بالمفتاح؟</p><ul><li><b>أ.</b> تضعه في ملف منفصل داخل مجلد المشروع، لا في الشيفرة</li><li><b>ب.</b> تلصقه في المحادثة مرة واحدة ليجرّب الوكيل، ثم تحذف الرسالة</li><li><b>ج.</b> تستخدمه الآن، وتطلب استبداله بعد أن تنجح التجربة</li><li><b>د.</b> لا تضعه في النموذج: الميزة تحتاج إلى مراجعة تقنية المعلومات</li></ul></li>
<li><p>أداة فريقك لحجز السيارات تعمل منذ شهرين في حدود مذكرتها. وصلتك اليوم أربعة طلبات. أيها يعني أن تتوقف عن التعديل وتسلّم الأداة إلى المطورين؟</p><ul><li><b>أ.</b> ترتيب قائمة السيارات بحسب الأحدث</li><li><b>ب.</b> ربطها ببوابة الدخول لتفتح للسيارة المحجوزة</li><li><b>ج.</b> رفع حد الحجز من ثلاثة أيام إلى أربعة</li><li><b>د.</b> إضافة حقل «سبب الحجز» إلى نموذج الطلب</li></ul></li>
<li><p>قاعدة في أداة مكتبة: «يُحسب يوم تأخير عن كل يوم بعد موعد الإرجاع». موعد إرجاع كتاب 2027-05-10، وأُرجع في 2027-05-13. كم يوم تأخير يجب أن تعرض الأداة؟ <span class="unit">(أيام)</span></p></li>
<li><p>قاعدة في أداة لطلبات الإجازة القصيرة: «الإجازة القصيرة خمسة أيام على الأكثر». عندك وقت لاختبارين فقط. أي زوج تختار؟</p><ul><li><b>أ.</b> يوم واحد، ثم عشرون يومًا</li><li><b>ب.</b> خمسة أيام، ثم ستة أيام</li><li><b>ج.</b> يومان، ثم ثلاثة أيام</li><li><b>د.</b> ستة أيام، ثم سبعة أيام</li></ul></li>
<li><p>في أداة لدليل الموظفين، البحث عن «أسامة» يعطي نتيجتين، والبحث عن «اسامه» لا يعطي شيئًا. ماذا تكتب في سجل الاختبار؟</p><ul><li><b>أ.</b> «البحث يحتاج إلى تحسين في المستقبل»</li><li><b>ب.</b> «على المستخدمين كتابة الاسم بهمزته وتائه المربوطة دائمًا»</li><li><b>ج.</b> «بحثت عن اسامه. المتوقع: نتيجتان. ما حدث: صفر»</li><li><b>د.</b> «البحث يعمل: الاسم الصحيح يعطي نتيجتين»</li></ul></li>
<li><p>في أداة لطلبات الشراء الصغيرة، يفتح الموظف طلبه من عنوان ينتهي بالرقم 118. جدول الوصول يقول: الموظف يرى طلباته هو فقط. ما الاختبار الذي يتحقق من هذه الخانة؟</p><ul><li><b>أ.</b> يغيّر الرقم إلى رقم طلب لزميله، والمتوقع رفض</li><li><b>ب.</b> يفتح طلبه رقم 118 مرتين، والمتوقع الصفحة نفسها</li><li><b>ج.</b> يدخل مديرًا ويفتح الطلب 118، والمتوقع أن يراه</li><li><b>د.</b> يبحث عن رابط إلى طلبات الزملاء في القائمة</li></ul></li>
<li><p>أداة لطلبات العمل الإضافي: المشرف يوافق على طلبات فريقه. في الاختبار دخلتَ مشرفًا، وقدّمت طلبًا باسمك، فظهر بجانبه زر «وافق» وعمل. المواصفات تقول: «المشرف يوافق على الطلبات». أين الخلل؟</p><ul><li><b>أ.</b> في الأداة وحدها: الوكيل خالف المواصفات</li><li><b>ب.</b> لا خلل: الأداة نفذت ما في المواصفات</li><li><b>ج.</b> في الشاشة: يكفي إخفاء الزر عن صاحب الطلب</li><li><b>د.</b> في المواصفات أولًا: «إلا طلبه» لم تُكتب</li></ul></li>
<li><p>أداة فريق لها رابط على الشبكة الداخلية، وفيها صفحة تقارير وزر لتنزيل التقرير الشهري. تريد أن تختبر عمود «دون دخول». ما أول ما تفعله؟</p><ul><li><b>أ.</b> تخرج من حسابك وتتأكد أن صفحة الدخول تظهر</li><li><b>ب.</b> تسأل الوكيل هل الصفحات كلها محمية</li><li><b>ج.</b> تفتح نافذة خاصة وتكتب عنوان ملف التقرير بيدك</li><li><b>د.</b> تدخل بدور الموظف وتبحث عن زر التنزيل</li></ul></li>
<li><p>مواصفات أداة لحجز مواقف السيارات تذكر أربعة حقول: الاسم، والرقم الوظيفي، ورقم الموقف، والتاريخ. فتحتَ ملف البيانات فوجدت عمودين آخرين: رقم لوحة السيارة، ورقم الجوال. ولا فعل في الأداة يستخدمهما. ما القرار؟</p><ul><li><b>أ.</b> يبقيان: قد يحتاجهما الفريق لاحقًا</li><li><b>ب.</b> يُحذفان من الملف ومن الأداة، ويُسجَّل ذلك</li><li><b>ج.</b> يبقيان في الملف، ويُخفيان من الشاشة</li><li><b>د.</b> يُضافان إلى المواصفات لتطابق الملف</li></ul></li>
<li><p>وأنت تراجع أداة بناها زميل، وجدت في ملف الشيفرة مفتاحًا حقيقيًّا لخدمة البريد التي تشترك فيها الجهة. المجلد أُرسل مضغوطًا إلى ثلاثة زملاء الأسبوع الماضي. ما أول خطوة؟</p><ul><li><b>أ.</b> تحذف السطر من الملف وتعيد إرسال المجلد</li><li><b>ب.</b> تنقل المفتاح إلى ملف منفصل في المجلد</li><li><b>ج.</b> تطلب من الزملاء الثلاثة حذف نسخهم</li><li><b>د.</b> تبلّغ صاحب الخدمة ليُلغى المفتاح ويُستبدل</li></ul></li>
<li><p>نموذج أولي نجح في اختبارات القبول الاثني عشر كلها. زميلتك تقول: «إذن هو جاهز للفريق». ما الذي لم تقله الاختبارات؟</p><ul><li><b>أ.</b> ما تحفظه زيادةً، وما في ملفاتها من أسرار</li><li><b>ب.</b> هل القواعد التي كُتبت لها اختبارات تعمل اليوم كما كُتبت</li><li><b>ج.</b> هل الأدوار المذكورة في الاختبارات تُمنع مما مُنعت منه</li><li><b>د.</b> هل تُقبل الطلبات الصحيحة التي جُرّبت في الاختبارات</li></ul></li>
<li><p>أربع صياغات لحد واحد في مذكرة تسليم أداة تعمل على جهاز واحد ولا نسخ احتياطي لها. أيها يصلح؟</p><ul><li><b>أ.</b> «نسخة تجريبية قد توجد فيها أخطاء»</li><li><b>ب.</b> «يُنصح بحفظ نسخة من ملف البيانات بين حين وآخر تحسبًا لأي طارئ»</li><li><b>ج.</b> «تعمل على جهاز واحد، وإن تلف ملف البيانات ضاع ما فيه»</li><li><b>د.</b> «للاستخدام الداخلي في حدود المعقول»</li></ul></li>
<li><p>في قسم المالك من أربع مذكرات تسليم كُتب ما يلي. أيها يُقبل؟</p><ul><li><b>أ.</b> «المالك: إدارة الخدمات المساندة»</li><li><b>ب.</b> «المالك: من بنى الأداة ما دام في الفريق، ثم من يخلفه»</li><li><b>ج.</b> «المالك: تقنية المعلومات عند الحاجة»</li><li><b>د.</b> «المالكة: سلمى، رئيسة الوحدة، وينوب عنها خالد»</li></ul></li>
<li><p>أداة فريق لتوزيع المناوبات تعمل في حدود مذكرتها. أي طلب من هذه يعني أن يتوقف الفريق عن التعديل ويسلّمها إلى المطورين؟</p><ul><li><b>أ.</b> أن تستخدمها ثلاث إدارات أخرى ببيانات موظفيها</li><li><b>ب.</b> أن يُضاف عمود «ملاحظات» إلى جدول المناوبات</li><li><b>ج.</b> أن يتغير حد المناوبات الأسبوعية من خمس إلى أربع</li><li><b>د.</b> أن تُرتَّب القائمة بحسب التاريخ</li></ul></li>
<li><p>بنيتَ أداة بوكيل برمجة ونجحت في اختباراتك كلها، ولا تقرأ الشيفرة. مراجع من تقنية المعلومات يسألك: «هل الأداة سليمة؟». أي جواب يصلح في مذكرة التسليم؟</p><ul><li><b>أ.</b> «نعم: الوكيل راجع الشيفرة كلها سطرًا سطرًا وأكد لي سلامتها»</li><li><b>ب.</b> «اختُبر سلوكها بهذه الاختبارات، ولم يراجع شيفرتها مطور»</li><li><b>ج.</b> «نعم: نجحت في كل الاختبارات فهي سليمة»</li><li><b>د.</b> «لا أعرف: لا أستطيع أن أقول عنها شيئًا»</li></ul></li>

تي لم توحّد أشكال الكتابة","","يسجل الحالة المريحة ويسكت عن الحالة التي فشلت"],"lo":["LO4"],"day":2,"session":1,"slide":{"deck":"day2","id":"arabic-text","title":"العربية تُكتب بأكثر من شكل، والأداة لا تعرف ذلك وحدها"},"level":"analyze","pool":"practice"},{"id":"q-role-01","type":"single","prompt":"في أداة لطلبات الشراء الصغيرة، يفتح الموظف طلبه من عنوان ينتهي بالرقم 118. جدول الوصول يقول: الموظف يرى طلباته هو فقط. ما الاختبار الذي يتحقق من هذه الخانة؟","options":[{"key":"أ","text":"يغيّر الرقم إلى رقم طلب لزميله، والمتوقع رفض"},{"key":"ب","text":"يفتح طلبه رقم 118 مرتين، والمتوقع الصفحة نفسها"},{"key":"ج","text":"يدخل مديرًا ويفتح الطلب 118، والمتوقع أن يراه"},{"key":"د","text":"يبحث عن رابط إلى طلبات الزملاء في القائمة"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"خانة «لا» تُختبر بالمحاولة: الأداة قد تتحقق من الدخول وتنسى أن تتحقق أن السجل لصاحبه. تغيير الرقم يكشف ذلك في ثوان.","misconceptions":["","يختبر خانة «نعم»: أن يرى طلبه لا يقول شيئًا عن طلبات غيره","يختبر دورًا آخر مسموحًا له: الخانة المطلوبة للموظف","غياب الرابط يختبر الشاشة لا المنع: العنوان يُكتب باليد"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"change-the-number","title":"غيّر الرقم في آخر العنوان"},"level":"apply","pool":"practice"},{"id":"q-role-02","type":"single","prompt":"أداة لطلبات العمل الإضافي: المشرف يوافق على طلبات فريقه. في الاختبار دخلتَ مشرفًا، وقدّمت طلبًا باسمك، فظهر بجانبه زر «وافق» وعمل. المواصفات تقول: «المشرف يوافق على الطلبات». أين الخلل؟","options":[{"key":"أ","text":"في الأداة وحدها: الوكيل خالف المواصفات"},{"key":"ب","text":"لا خلل: الأداة نفذت ما في المواصفات"},{"key":"ج","text":"في الشاشة: يكفي إخفاء الزر عن صاحب الطلب"},{"key":"د","text":"في المواصفات أولًا: «إلا طلبه» لم تُكتب"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"الوكيل بنى ما كُتب. قاعدة فصل المهام بديهية عند صاحب الحاجة فلم يكتبها، والوكيل لا بديهيات له. تُكتب في القاعدة وجدول الوصول، ولها اختبار، ثم تُصلح في الخادم.","misconceptions":["المواصفات لم تمنع ذلك: الوكيل لم يخالف نصًّا مكتوبًا","يعامل مطابقة المواصفات نهاية الاختبار: المواصفات نفسها ناقصة","يصلح الشاشة ويترك الأمر يُرسل مباشرة: المنع في الخادم",""],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"not-your-own-request","title":"من يوافق لا يوافق لنفسه"},"level":"analyze","pool":"practice"},{"id":"q-role-03","type":"single","prompt":"أداة فريق لها رابط على الشبكة الداخلية، وفيها صفحة تقارير وزر لتنزيل التقرير الشهري. تريد أن تختبر عمود «دون دخول». ما أول ما تفعله؟","options":[{"key":"أ","text":"تخرج من حسابك وتتأكد أن صفحة الدخول تظهر"},{"key":"ب","text":"تسأل الوكيل هل الصفحات كلها محمية"},{"key":"ج","text":"تفتح نافذة خاصة وتكتب عنوان ملف التقرير بيدك"},{"key":"د","text":"تدخل بدور الموظف وتبحث عن زر التنزيل"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"النافذة الخاصة لا دخول فيها، وعنوان الملف أكثر ما يُنسى: الصفحات تُحمى لأنها أمام الوكيل، وروابط التنزيل تُضاف في آخر لحظة.","misconceptions":["يختبر الصفحة الأولى وحدها: الملفات والصفحات الداخلية لم تُجرَّب","جواب الوكيل خبر لا اختبار","","يختبر دورًا داخلًا: العمود المطلوب لمن لم يدخل"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"without-sign-in","title":"اختبر الأداة وأنت لم تدخل"},"level":"apply","pool":"practice"},{"id":"q-data-01","type":"single","prompt":"مواصفات أداة لحجز مواقف السيارات تذكر أربعة حقول: الاسم، والرقم الوظيفي، ورقم الموقف، والتاريخ. فتحتَ ملف البيانات فوجدت عمودين آخرين: رقم لوحة السيارة، ورقم الجوال. ولا فعل في الأداة يستخدمهما. ما القرار؟","options":[{"key":"أ","text":"يبقيان: قد يحتاجهما الفريق لاحقًا"},{"key":"ب","text":"يُحذفان من الملف ومن الأداة، ويُسجَّل ذلك"},{"key":"ج","text":"يبقيان في الملف، ويُخفيان من الشاشة"},{"key":"د","text":"يُضافان إلى المواصفات لتطابق الملف"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الحقل الذي لا يحتاجه فعل لا يُحفظ. الزيادة تأتي من ملف نُسخ كما هو أو من وكيل أضاف ما قد يفيد، وما يُحفظ يمكن أن ينكشف.","misconceptions":["يحفظ بيانات شخصية على احتمال: كل حقل محفوظ خطر بلا فائدة اليوم","","الإخفاء من الشاشة لا يخرجها من الملف ولا من التصدير","يغيّر المواصفات لتبرر الأداة، والصحيح العكس"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"inventory-the-data","title":"اجرد ما في الأداة، وقارنه بما في المواصفات"},"level":"apply","pool":"practice"},{"id":"q-data-02","type":"single","prompt":"وأنت تراجع أداة بناها زميل، وجدت في ملف الشيفرة مفتاحًا حقيقيًّا لخدمة البريد التي تشترك فيها الجهة. المجلد أُرسل مضغوطًا إلى ثلاثة زملاء الأسبوع الماضي. ما أول خطوة؟","options":[{"key":"أ","text":"تحذف السطر من الملف وتعيد إرسال المجلد"},{"key":"ب","text":"تنقل المفتاح إلى ملف منفصل في المجلد"},{"key":"ج","text":"تطلب من الزملاء الثلاثة حذف نسخهم"},{"key":"د","text":"تبلّغ صاحب الخدمة ليُلغى المفتاح ويُستبدل"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"السر الذي كُتب في ملف وسافر يُعد مكشوفًا: لا يُعرف من قرأه. التبليغ أولًا ليموت المفتاح القديم، ثم الحذف والتسجيل.","misconceptions":["الحذف يريح الباني ولا يحمي الخدمة: المفتاح القديم ما زال يعمل","ينقل السر من مكان مكشوف إلى مكان مكشوف","لا يضمن شيئًا: النسخ قد أُعيد إرسالها، والمفتاح ما زال حيًّا",""],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"written-means-exposed","title":"السر الذي كُتب في ملف يُعد مكشوفًا: يُستبدل، ولا يكفي حذفه"},"level":"analyze","pool":"practice"},{"id":"q-data-03","type":"single","prompt":"نموذج أولي نجح في اختبارات القبول الاثني عشر كلها. زميلتك تقول: «إذن هو جاهز للفريق». ما الذي لم تقله الاختبارات؟","options":[{"key":"أ","text":"ما تحفظه زيادةً، وما في ملفاتها من أسرار"},{"key":"ب","text":"هل القواعد التي كُتبت لها اختبارات تعمل اليوم كما كُتبت"},{"key":"ج","text":"هل الأدوار المذكورة في الاختبارات تُمنع مما مُنعت منه"},{"key":"د","text":"هل تُقبل الطلبات الصحيحة التي جُرّبت في الاختبارات"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"اختبارات القبول تسأل: هل تفعل الأداة ما طُلب؟ الحقول الزائدة والأسرار المكتوبة ليست مما طُلب، ويكشفها الجرد والفحص لا "id":"an-owner-with-a-name","title":"لكل أداة مالك باسمه، ومن يدعمها، وموعد تُراجَع فيه"},"level":"apply","pool":"practice"},{"id":"q-hand-03","type":"single","prompt":"أداة فريق لتوزيع المناوبات تعمل في حدود مذكرتها. أي طلب من هذه يعني أن يتوقف الفريق عن التعديل ويسلّمها إلى المطورين؟","options":[{"key":"أ","text":"أن تستخدمها ثلاث إدارات أخرى ببيانات موظفيها"},{"key":"ب","text":"أن يُضاف عمود «ملاحظات» إلى جدول المناوبات"},{"key":"ج","text":"أن يتغير حد المناوبات الأسبوعية من خمس إلى أربع"},{"key":"د","text":"أن تُرتَّب القائمة بحسب التاريخ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"مستخدمون من خارج الفريق وبيانات موظفين حقيقية: تغيّر جواب سؤالين من الخمسة. هذا شرط تسليم يُكتب في المذكرة قبل أن يقع.","misconceptions":["","حقل له فعل واضح داخل الحدود: يدخل المواصفات ويُختبر","تغيير قاعدة داخل الحدود: يبدأ من المواصفات وله اختبار عند الحد","تغيير عرض داخل الحدود: طلب واحد ثم إعادة الاختبارات"],"lo":["LO5"],"day":2,"session":4,"slide":{"deck":"day2","id":"when-developers-take-over","title":"الأسئلة الخمسة تعود شروطًا: إن صار جواب أحدها «نعم» سلّمت"},"level":"analyze","pool":"practice"},{"id":"q-hand-04","type":"single","prompt":"بنيتَ أداة بوكيل برمجة ونجحت في اختباراتك كلها، ولا تقرأ الشيفرة. مراجع من تقنية المعلومات يسألك: «هل الأداة سليمة؟». أي جواب يصلح في مذكرة التسليم؟","options":[{"key":"أ","text":"«نعم: الوكيل راجع الشيفرة كلها سطرًا سطرًا وأكد لي سلامتها»"},{"key":"ب","text":"«اختُبر سلوكها بهذه الاختبارات، ولم يراجع شيفرتها مطور»"},{"key":"ج","text":"«نعم: نجحت في كل الاختبارات فهي سليمة»"},{"key":"د","text":"«لا أعرف: لا أستطيع أن أقول عنها شيئًا»"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"ما تملكه دليل على السلوك في حدود ما اختبرت. تقوله كما هو، وتقول ما لم يُفحص. الحدود المكتوبة تجعل الأداة موثوقة في حدودها.","misconceptions":["قول الوكيل عن شيفرته خبر لا مراجعة","","يمدّ نتيجة الاختبارات إلى ما لم تختبره","يهدر ما عنده: الاختبارات والسجلات دليل حقيقي على السلوك"],"lo":["LO5"],"day":2,"session":4,"slide":{"deck":"day2","id":"code-you-cannot-read","title":"اختبرتَ سلوك الأداة، لا شيفرتها. قل ذلك لمن يستلمها"},"level":"understand","pool":"practice"}]}</script>
